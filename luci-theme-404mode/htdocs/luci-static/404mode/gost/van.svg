<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <!-- 404 Mode / ГОСТ-24 — original illustration: jet-propelled field van. Apache-2.0 -->
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V4" stroke="#1a1916" stroke-width="1.1"/>
    </pattern>
    <pattern id="hatch2" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)">
      <path d="M0 0V3" stroke="#1a1916" stroke-width=".8"/>
    </pattern>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".9" fill="#e9e1c9"/>
    </pattern>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#f3e6bb" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f3e6bb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" x2="0">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".25" stop-color="#ffc24a"/>
      <stop offset=".6" stop-color="#e5552a"/>
      <stop offset="1" stop-color="#a3201b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8d2"/>
      <stop offset=".55" stop-color="#ddd3b6"/>
      <stop offset="1" stop-color="#b9ae8e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d3a"/>
      <stop offset="1" stop-color="#141513"/>
    </linearGradient>
    <clipPath id="lower"><rect x="40" y="86" width="230" height="50"/></clipPath>
  </defs>

  <!-- headlight beam -->
  <path d="M258 103 L320 70 L320 150 Z" fill="url(#beam)"/>
  <path d="M258 103 L320 92 M258 103 L320 118" stroke="#fff6d8" stroke-opacity=".35" stroke-width="1"/>

  <!-- smoke -->
  <g fill="#6d6a61" opacity=".55">
    <circle cx="14" cy="92" r="9"/><circle cx="26" cy="84" r="7"/><circle cx="8" cy="106" r="7"/>
    <circle cx="30" cy="100" r="6"/>
  </g>
  <g fill="url(#dots)" opacity=".35">
    <circle cx="14" cy="92" r="9"/><circle cx="26" cy="84" r="7"/>
  </g>

  <!-- jet flame -->
  <path d="M62 92 C46 86 26 90 4 96 C26 100 44 104 62 104 Z" fill="url(#flame)"/>
  <path d="M62 95 C50 93 40 95 26 97 C40 99 50 101 62 101 Z" fill="#fff8dc" opacity=".9"/>
  <g stroke="#e9e1c9" stroke-width="1.2" opacity=".6">
    <path d="M40 76 H8"/><path d="M48 112 H18"/><path d="M36 120 H4"/><path d="M52 68 H28"/>
  </g>

  <!-- nozzle -->
  <path d="M62 88 L72 86 L72 108 L62 106 Z" fill="#3b3a35" stroke="#0f0f0d" stroke-width="1.6"/>
  <path d="M65 89 V105 M68 88 V106" stroke="#7d786a" stroke-width=".8"/>

  <!-- wing (far side, under body) -->
  <path d="M96 116 L54 150 L82 152 L170 120 Z" fill="#cfc4a4" stroke="#0f0f0d" stroke-width="1.8"/>
  <path d="M96 116 L54 150 L82 152 L170 120 Z" fill="url(#hatch2)" opacity=".35"/>
  <path d="M82 128 L150 124 M70 140 L120 132" stroke="#0f0f0d" stroke-width=".9"/>
  <!-- wing star -->
  <path d="M86 138 l2.4 5 5.5 .8 -4 3.8 1 5.4 -4.9-2.6 -4.9 2.6 1-5.4 -4-3.8 5.5-.8 z" fill="#c8312a" stroke="#0f0f0d" stroke-width=".9" transform="translate(-6 -6) scale(.95)"/>

  <!-- antennas & roof gear -->
  <g stroke="#0f0f0d" stroke-width="1.6">
    <path d="M112 40 L98 4"/><circle cx="98" cy="4" r="2.2" fill="#e9e1c9"/>
    <path d="M124 40 L120 14"/><path d="M114 22 H126 M116 17 H124"/>
    <path d="M196 40 L214 2"/><circle cx="214" cy="2" r="1.8" fill="#c8312a"/>
    <path d="M206 40 L206 18"/><path d="M200 22 H212 M202 27 H210"/>
  </g>
  <!-- roof rack + dish -->
  <path d="M120 40 V33 H190 V40" fill="#cfc4a4" stroke="#0f0f0d" stroke-width="1.6"/>
  <path d="M128 33 V40 M140 33 V40 M152 33 V40 M164 33 V40 M176 33 V40" stroke="#0f0f0d" stroke-width=".9"/>
  <path d="M150 33 L156 25" stroke="#0f0f0d" stroke-width="1.6"/>
  <ellipse cx="160" cy="20" rx="11" ry="6" transform="rotate(-25 160 20)" fill="#e9e1c9" stroke="#0f0f0d" stroke-width="1.6"/>
  <path d="M160 20 L170 14" stroke="#0f0f0d" stroke-width="1.2"/>
  <rect x="170" y="27" width="14" height="6" fill="#3b3a35" stroke="#0f0f0d" stroke-width="1.2"/>

  <!-- body -->
  <path id="hull" d="M74 52 Q74 40 88 40 L224 40 Q240 40 246 56 L256 86 Q260 95 260 104 L260 114 Q260 122 252 122 L80 122 Q72 122 72 114 Z" fill="url(#body)" stroke="#0f0f0d" stroke-width="2.4"/>
  <!-- lower shading -->
  <g clip-path="url(#lower)">
    <path d="M74 52 Q74 40 88 40 L224 40 Q240 40 246 56 L256 86 Q260 95 260 104 L260 114 Q260 122 252 122 L80 122 Q72 122 72 114 Z" fill="url(#hatch)" opacity=".38"/>
  </g>
  <!-- roof highlight -->
  <path d="M90 44 H222" stroke="#fffaf0" stroke-width="2" opacity=".7"/>

  <!-- belt line -->
  <path d="M73 84 H254" stroke="#0f0f0d" stroke-width="1.6"/>
  <path d="M73 88 H256" stroke="#0f0f0d" stroke-width=".8"/>

  <!-- windows -->
  <g fill="url(#glass)" stroke="#0f0f0d" stroke-width="1.6">
    <rect x="84" y="50" width="30" height="26" rx="4"/>
    <rect x="120" y="50" width="30" height="26" rx="4"/>
    <rect x="156" y="50" width="30" height="26" rx="4"/>
    <path d="M194 50 H222 Q226 50 228 54 L232 76 H194 Z"/>
    <path d="M232 50 Q238 50 241 57 L249 80 H238 Z"/>
  </g>
  <g stroke="#e9e1c9" stroke-width="1.1" opacity=".55">
    <path d="M88 70 L102 54"/><path d="M124 70 L138 54"/><path d="M160 70 L174 54"/><path d="M198 70 L212 54"/>
  </g>

  <!-- doors -->
  <g stroke="#0f0f0d" stroke-width="1.2">
    <path d="M190 46 V120"/><path d="M152 80 V120"/>
    <path d="M180 92 H186"/><path d="M196 92 H202"/>
  </g>

  <!-- side star -->
  <g transform="translate(120 102)">
    <circle r="12" fill="#efe8d2" stroke="#0f0f0d" stroke-width="1.4"/>
    <path d="M0 -10 L2.9 -3.6 9.5 -3.1 4.5 1.4 6 8.1 0 4.6 -6 8.1 -4.5 1.4 -9.5 -3.1 -2.9 -3.6 Z" fill="#c8312a" stroke="#0f0f0d" stroke-width="1"/>
  </g>
  <!-- stencil serial -->
  <g fill="#0f0f0d" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="7" font-weight="700" letter-spacing=".5">
    <text x="160" y="112">404-24</text>
  </g>

  <!-- nose: grille, headlight, bumper -->
  <g stroke="#0f0f0d" stroke-width="1.2">
    <path d="M246 96 V114 M250 96 V114 M254 96 V114"/>
  </g>
  <circle cx="256" cy="94" r="5.5" fill="#fff6d8" stroke="#0f0f0d" stroke-width="1.6"/>
  <circle cx="256" cy="94" r="2.2" fill="#ffffff"/>
  <path d="M238 122 H264 V128 H236 Z" fill="#3b3a35" stroke="#0f0f0d" stroke-width="1.6"/>
  <path d="M70 122 H92 V127 H70 Z" fill="#3b3a35" stroke="#0f0f0d" stroke-width="1.6"/>

  <!-- wheels -->
  <g stroke="#0f0f0d" stroke-width="2">
    <path d="M92 122 A20 20 0 0 1 132 122" fill="#262521"/>
    <path d="M204 122 A20 20 0 0 1 244 122" fill="#262521"/>
    <circle cx="112" cy="126" r="15" fill="#1f1e1b"/>
    <circle cx="224" cy="126" r="15" fill="#1f1e1b"/>
    <circle cx="112" cy="126" r="7" fill="#b9ae8e"/>
    <circle cx="224" cy="126" r="7" fill="#b9ae8e"/>
  </g>
  <g stroke="#e9e1c9" stroke-width="1" opacity=".5">
    <path d="M100 116 A15 15 0 0 1 112 111"/><path d="M212 116 A15 15 0 0 1 224 111"/>
  </g>
  <g fill="#0f0f0d">
    <circle cx="112" cy="126" r="2"/><circle cx="224" cy="126" r="2"/>
  </g>
</svg>
