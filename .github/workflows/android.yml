name: Android widget

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease -Pvc=${{ github.run_number }} 2>&1 | tee build.log

      # compiler errors as annotations: readable from the Checks API without a login
      - name: Report errors
        if: failure()
        working-directory: android
        run: |
          grep -E '^e: |error:|What went wrong|AAPT|Execution failed|> ' build.log | head -40 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/404mode-widget.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: 404mode-widget
          path: dist/404mode-widget.apk

      # one rolling release: the download link never changes
      - name: Move the android-widget tag
        run: |
          git tag -f android-widget
          git push -f origin android-widget

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-widget
          name: Android-виджет 1.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: dist/404mode-widget.apk
          body: |
            Виджет «Роутер 404» для Android 8+: интернет, нода прокси, сигнал LTE.
            Установка: скачайте 404mode-widget.apk на телефон и откройте (разрешите установку из браузера).
            Настройка: в приложении роутера (/app/) нажмите «Настроить виджет» или введите адрес и ключ из LuCI › Система › Приложение на телефон.
            Сборка ${{ github.sha }}.
